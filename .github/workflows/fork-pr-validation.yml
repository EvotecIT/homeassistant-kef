name: Fork PR Validation

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: fork-pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  start:
    if: github.event.pull_request.head.repo.fork == true
    runs-on: ubuntu-latest
    permissions:
      checks: write
    outputs:
      check-id: ${{ steps.check.outputs.check-id }}
    steps:
      - name: Start trusted PR-head validation check
        id: check
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const { data: check } = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: context.payload.pull_request.head.sha,
              name: "fork-pr-validation",
              status: "in_progress",
              output: {
                title: "Fork pull request validation",
                summary: "Credential-free validation is running on the pull request head."
              }
            });
            core.setOutput("check-id", check.id);

  validate_hacs:
    needs: start
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out untrusted pull request head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: HACS validation
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main
        with:
          category: integration

  test:
    needs: start
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Check out untrusted pull request head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[test]

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest

  hassfest:
    needs: start
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out untrusted pull request head without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@a7c616ce81ccda50150bf1595786c71b1883fabb # master

  report:
    if: always() && needs.start.result == 'success'
    needs: [start, validate_hacs, test, hassfest]
    runs-on: ubuntu-latest
    permissions:
      checks: write
    steps:
      - name: Complete trusted PR-head validation check
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CHECK_ID: ${{ needs.start.outputs.check-id }}
          HACS_RESULT: ${{ needs.validate_hacs.result }}
          TEST_RESULT: ${{ needs.test.result }}
          HASSFEST_RESULT: ${{ needs.hassfest.result }}
        with:
          script: |
            const results = {
              "HACS validation": process.env.HACS_RESULT,
              "Python tests": process.env.TEST_RESULT,
              "Hassfest": process.env.HASSFEST_RESULT
            };
            const passed = Object.values(results).every(result => result === "success");
            const summary = Object.entries(results)
              .map(([name, result]) => `- ${name}: ${result}`)
              .join("\n");

            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number(process.env.CHECK_ID),
              status: "completed",
              conclusion: passed ? "success" : "failure",
              output: {
                title: passed
                  ? "Fork pull request validation passed"
                  : "Fork pull request validation failed",
                summary
              }
            });

            if (!passed) {
              core.setFailed("One or more credential-free validation jobs failed.");
            }
